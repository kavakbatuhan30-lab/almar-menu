<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al Mar · Fish and Grill — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#121110; --ink2:#1d1916; --peach:#FFEDDF; --cream:#FFF6EF; --sand:#F4DECD;
  --gold:#B98D5C; --gold2:#E3C49A; --text:#1d1a17; --muted:#8a776a; --line:rgba(29,26,23,.11);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{font-family:var(--sans);background:var(--peach);color:var(--text);-webkit-font-smoothing:antialiased;font-weight:400}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:620px;margin:0 auto;padding:0 20px}

/* HERO */
.hero{position:relative;min-height:86svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--peach);
  background:radial-gradient(110% 70% at 50% 8%,#3a2c20 0%,#1b1612 45%,#100e0d 100%);overflow:hidden;padding:70px 24px 90px}
.hero:before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(227,196,154,.035) 0 1px,transparent 1px 64px);pointer-events:none}
.hero .ring{position:absolute;width:560px;height:560px;border:1px solid rgba(227,196,154,.14);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-56%)}
.hero .ring.r2{width:760px;height:760px;border-color:rgba(227,196,154,.07)}
.langs{position:absolute;top:18px;right:18px;display:flex;gap:2px;border:1px solid rgba(255,237,223,.22);border-radius:99px;padding:3px;z-index:2}
.langs button{font-size:11px;letter-spacing:.14em;padding:6px 10px;border-radius:99px;color:rgba(255,237,223,.7)}
.langs button.on{background:var(--peach);color:var(--ink)}
.hero .logo{width:min(76vw,390px);color:var(--peach);position:relative;filter:drop-shadow(0 8px 30px rgba(0,0,0,.35))}
.hero .rule{width:54px;height:1px;background:var(--gold2);margin:30px auto 18px;opacity:.8}
.hero .place{font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:var(--gold2)}
.hero .tag{font-family:var(--serif);font-style:italic;font-size:30px;margin-top:22px;line-height:1.1;color:#fff4ea}
.hero .cta{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,237,223,.75);display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none}
.hero .cta span{width:1px;height:34px;background:linear-gradient(var(--gold2),transparent);animation:drip 2.2s ease-in-out infinite}
@keyframes drip{0%,100%{transform:scaleY(.4);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}}

/* HOW */
.how{padding:58px 0 18px}
.kicker{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
h2{font-family:var(--serif);font-weight:500;font-size:38px;line-height:1.05;margin-top:8px;letter-spacing:-.005em}
.steps{margin-top:26px;display:grid;gap:12px}
.step{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start;background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:18px 18px}
.step b{font-family:var(--serif);font-style:italic;font-weight:500;font-size:32px;line-height:1;color:var(--gold)}
.step p{font-size:15px;line-height:1.5;color:#3b332c;font-weight:300}
.step p strong{font-weight:500;color:var(--text)}

/* SIGNATURE */
.sig{padding:46px 0 10px}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:22px 20px 14px;margin:0 -20px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{flex:0 0 min(68vw,250px);scroll-snap-align:start;border-radius:22px;overflow:hidden;background:radial-gradient(90% 70% at 50% 30%,#33271d 0%,#16120f 75%);color:var(--peach);text-decoration:none;display:flex;flex-direction:column;position:relative;aspect-ratio:4/5;box-shadow:0 18px 40px -22px rgba(30,20,10,.55)}
.card .art{flex:1;display:flex;align-items:center;justify-content:center;padding:26px}
.card .art svg{width:82%;height:auto;overflow:visible}
.card .art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.card.photo .art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,14,13,0) 30%,rgba(16,14,13,.7) 58%,rgba(16,14,13,.96) 100%)}
.card.photo:after{border-color:rgba(255,237,223,.28)}
.card .meta{position:relative;padding:0 20px 20px}
.card .meta small{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold2)}
.card .meta h3{font-family:var(--serif);font-weight:500;font-size:24px;line-height:1.08;margin:6px 0 8px}
.card .meta .p{font-size:13px;letter-spacing:.06em;color:rgba(255,237,223,.8)}
.card:after{content:"";position:absolute;inset:10px;border:1px solid rgba(227,196,154,.18);border-radius:15px;pointer-events:none}

/* NAV */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,237,223,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin-top:26px}
.nav .in{display:flex;align-items:center;gap:6px;max-width:620px;margin:0 auto;padding:10px 0 10px 16px}
.nav .mini{flex:0 0 auto;width:58px;color:var(--ink);margin-right:4px;opacity:.9}
.pills{display:flex;gap:6px;min-width:0;flex:1;padding-left:10px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 20px),transparent);overflow-x:auto;scrollbar-width:none;padding-right:16px}
.pills::-webkit-scrollbar{display:none}
.pills a{flex:0 0 auto;font-size:13px;padding:8px 14px;border-radius:99px;text-decoration:none;color:#5a4d43;border:1px solid transparent;white-space:nowrap;transition:.2s}
.pills a.on{background:var(--ink);color:var(--peach)}

/* SECTIONS */
section.cat{padding:44px 0 8px}
.cat-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--text)}
.cat-head .ic{width:44px;height:44px;flex:0 0 auto;color:var(--gold)}
.where{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.where i{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.intro{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.35;color:#4a3f36;margin:18px 0 4px}
.group{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin:26px 0 2px}
.item{display:grid;grid-template-columns:1fr auto;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.item h4{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.15;letter-spacing:.003em}
.item .d{font-size:13.5px;line-height:1.5;color:var(--muted);font-weight:300;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tags span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border-radius:99px;border:1px solid rgba(185,141,92,.45);color:#8c6740}
.tags span.s{background:var(--ink);border-color:var(--ink);color:var(--gold2)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.var{display:flex;align-items:center;gap:10px}
.var .vl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.price{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.price em{font-style:normal;font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}
.qty{display:flex;align-items:center;gap:4px}
.qbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);transition:.15s}
.qbtn svg{width:14px;height:14px}
.qbtn:active{transform:scale(.92)}
.qty.has .plus{background:var(--ink);border-color:var(--ink);color:var(--peach)}
.qty .n{min-width:18px;text-align:center;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.qty:not(.has) .minus,.qty:not(.has) .n{display:none}
.item.ph{grid-template-columns:92px 1fr;gap:16px;align-items:start}
.thumb{width:92px;height:92px;border-radius:18px;overflow:hidden;background:var(--sand);box-shadow:0 10px 22px -14px rgba(40,25,10,.55)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.item.ph .bottom{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.item.ph .var{justify-content:flex-end}
.item.ph .var .vl{margin-right:auto}
.item.ph .var .price:first-child{margin-right:auto}
.note{margin:22px 0 6px;padding:16px 18px;border-left:2px solid var(--gold);background:rgba(255,246,239,.7);border-radius:0 14px 14px 0;font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.4;color:#4a3f36}

/* FOOTER */
footer{margin-top:60px;background:var(--ink);color:var(--peach);text-align:center;padding:56px 24px 130px}
footer .logo{width:170px;color:var(--peach);margin:0 auto}
footer .tag{font-family:var(--serif);font-style:italic;font-size:24px;margin:22px 0 6px}
footer p{font-size:12.5px;letter-spacing:.06em;color:rgba(255,237,223,.6);line-height:1.8}
footer .credit{margin-top:26px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(227,196,154,.55)}

/* SELECTION BAR */
.bar{position:fixed;left:50%;bottom:16px;transform:translate(-50%,140%);width:min(calc(100% - 28px),560px);z-index:40;background:var(--ink);color:var(--peach);border-radius:20px;display:flex;align-items:center;justify-content:space-between;padding:12px 12px 12px 18px;box-shadow:0 20px 40px -14px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.bar.show{transform:translate(-50%,0)}
.bar .l small{display:block;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold2)}
.bar .l span{font-size:15px}
.bar .go{background:var(--peach);color:var(--ink);border-radius:14px;padding:11px 18px;font-size:14px;font-weight:500}
.count{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:99px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:600;margin-right:8px;padding:0 6px}

/* SHEET */
.scrim{position:fixed;inset:0;background:rgba(18,17,16,.5);z-index:50;opacity:0;pointer-events:none;transition:.3s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(100%,620px);max-height:88svh;overflow:auto;background:var(--cream);z-index:60;border-radius:26px 26px 0 0;padding:10px 22px 26px;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:translate(-50%,0)}
.grab{width:40px;height:4px;border-radius:9px;background:rgba(29,26,23,.18);margin:4px auto 16px}
.sheet h3{font-family:var(--serif);font-weight:500;font-size:32px}
.sheet .hint{font-size:13.5px;color:var(--muted);margin-top:4px;font-weight:300}
.tbl{display:flex;align-items:center;justify-content:space-between;margin:20px 0 8px;padding:14px 16px;background:var(--peach);border-radius:16px}
.tbl label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#6c5c50}
.tbl .qty input{width:50px;text-align:center;font:500 20px var(--sans);background:transparent;border:0;color:var(--text);-moz-appearance:textfield}
.tbl input::-webkit-outer-spin-button,.tbl input::-webkit-inner-spin-button{-webkit-appearance:none}
.sgroup{margin-top:20px}
.sgroup h5{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:500;padding-bottom:8px;border-bottom:1px solid var(--line)}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.srow .nm{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.15}
.srow .nm small{display:block;font-family:var(--sans);font-weight:300;font-size:12px;color:var(--muted)}
.srow .qty.has .plus{background:transparent;color:var(--gold);border-color:var(--gold)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px}
.tot span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#6c5c50}
.tot b{font-size:22px;font-weight:500}
.wnote{font-size:12px;color:var(--muted);text-align:right;margin-top:2px}
.actions{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:20px}
.btn{border-radius:16px;padding:15px 18px;font-size:15px;font-weight:500}
.btn.dark{background:var(--ink);color:var(--peach)}
.btn.ghost{border:1px solid var(--line);color:#6c5c50}
.emptyMsg{padding:26px 0 10px;color:var(--muted);font-size:14px;text-align:center}

/* SHOW AT COUNTER */
.show{}
.counter{position:fixed;inset:0;z-index:80;background:var(--peach);overflow:auto;display:none;padding:28px 24px 40px}
.counter.on{display:block}
.counter .x{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--peach);display:grid;place-items:center}
.counter .x svg{width:16px;height:16px}
.counter .logo{width:130px;color:var(--ink)}
.counter .tnum{margin-top:26px;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.counter .tnum b{display:block;font-family:var(--serif);font-weight:500;font-size:96px;line-height:.95;letter-spacing:-.02em;color:var(--ink)}
.counter ul{list-style:none;margin-top:22px;border-top:1px solid var(--text)}
.counter li{display:flex;gap:14px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.15}
.counter li b{font-family:var(--sans);font-weight:500;font-size:20px;color:var(--gold);min-width:34px}
.counter li small{display:block;font-family:var(--sans);font-size:13px;font-weight:300;color:var(--muted)}
.counter .sub{margin-top:30px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.counter .sub + ul li{font-size:19px}
.counter .sub + ul li b{font-size:15px}
.counter .foot{margin-top:28px;font-family:var(--serif);font-style:italic;font-size:19px;color:#4a3f36}

@media (min-width:760px){
  .hero{min-height:92vh}
  h2{font-size:46px}
  .steps{grid-template-columns:repeat(3,1fr)}
  .step{grid-template-columns:1fr;gap:10px}
  .rail{margin:0;padding:22px 0 14px}
}
</style>
</head>

  <button class="go" id="openSheet" data-t="view"></button>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3 data-t="selection"></h3>
  <p class="hint" data-t="selHint"></p>
  <div class="tbl">
    <label for="tnum" data-t="table"></label>
    <div class="qty has">
      <button class="qbtn minus" id="tMinus" aria-label="-"><svg viewBox="0 0 14 14"><path d="M2 7h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <input id="tnum" type="number" inputmode="numeric" min="1" max="99" placeholder="–">
      <button class="qbtn plus" id="tPlus" aria-label="+"><svg viewBox="0 0 14 14"><path d="M2 7h10M7 2v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <div id="sheetBody"></div>
  <div class="actions">
    <button class="btn ghost" id="clear" data-t="clear"></button>
    <button class="btn dark" id="showBtn" data-t="show"></button>
  </div>
</div>

<div class="counter" id="counter" role="dialog" aria-modal="true">
  <button class="x" id="closeCounter" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  <svg class="logo" viewBox="0 0 3168 1120" aria-hidden="true"><use href="#logo"/></svg>
  <div id="counterBody"></div>
</div>

  {name:L('Thee','Thé','Tea'),desc:L('Klassiek, groen, kamille of citrus','Classique, vert, camomille ou agrumes','Classic, green, chamomile or citrus'),v:one('thee',3)},
  {name:L('Verse gemberthee','Thé au gingembre frais','Fresh ginger tea'),v:one('gember',3.5)},
  {name:L('Verse muntthee','Thé à la menthe fraîche','Fresh mint tea'),desc:L('Per glas','Au verre','By the glass'),v:one('munt',3)},
  {name:L('Supplement hazelnootsiroop','Supplément sirop noisette','Hazelnut syrup'),v:one('hazel',1)}
 ]}
];
/* Signature cards — set img:'path.jpg' later to replace the illustration with a real photo */
const SIG=[
 {art:'fish',to:'specialiteiten',k:L('Specialiteit','Spécialité','Signature'),name:L('Plateau verse vis & zeevruchten','Plateau poisson & fruits de mer','Fish & seafood platter'),price:26.9,unit:'kg',from:true,img:'img/fish-card.jpg'},
 {art:'fish',to:'schotels',k:L('Van de houtskool','Au charbon de bois','From the charcoal'),name:L('Schotel zalmfilet','Assiette filet de saumon','Salmon fillet plate'),price:18.95,img:'img/salmon-card.jpg'},
 {art:'grill',to:'specialiteiten',k:L('Op houtskool','Au charbon de bois','Over charcoal'),name:L('Plateau vlees & gevogelte','Plateau viandes & volailles','Meat & poultry platter'),price:29.9,unit:'kg',img:null},
 {art:'shrimp',to:'catch',k:L('Catch of the day','Pêche du jour','Catch of the day'),name:L('Blacktigers','Crevettes Black Tiger','Black tiger prawns'),price:50,unit:'kg',img:null},
 {art:'baklava',to:'dessert',k:L('Dessert','Dessert','Dessert'),name:L('Baklava met Turks ijs','Baklava & glace turque','Baklava with Turkish ice cream'),price:12.9,img:null}
];

/* ---------- State ---------- */
const store={get(k,d){try{const v=localStorage.getItem('almar_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('almar_'+k,JSON.stringify(v))}catch(e){}}};
let lang=store.get('lang',null)||((navigator.language||'nl').slice(0,2)==='fr'?'fr':(navigator.language||'').slice(0,2)==='en'?'en':'nl');
if(!T[lang])lang='nl';
let sel=store.get('sel',{}); let table=store.get('table','');
const V={}; // variant lookup
MENU.forEach(sec=>sec.items.forEach(it=>{if(it.v)it.v.forEach(v=>V[v.id]={v,it,sec})}));
Object.keys(sel).forEach(k=>{if(!V[k])delete sel[k]});

const t=k=>T[lang][k];
const tx=o=>o?o[lang]:'';
const fmt=n=>new Intl.NumberFormat(lang==='en'?'en-GB':lang+'-BE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const unitTxt=u=>u==='kg'?'<em>/kg</em>':u==='st'?`<em>/${t('st')}</em>`:'';
const PLUS='<svg viewBox="0 0 14 14"><path d="M2 7h10M7 2v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const MINUS='<svg viewBox="0 0 14 14"><path d="M2 7h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const qtyHTML=id=>{const n=sel[id]||0;return `<div class="qty ${n?'has':''}" data-id="${id}"><button class="qbtn minus" data-act="dec" aria-label="−">${MINUS}</button><span class="n">${n}</span><button class="qbtn plus" data-act="inc" aria-label="+">${PLUS}</button></div>`};

/* ---------- Photos (example photos — replace with the restaurant's own shots later) ---------- */
const PHOTO={fish:'img/fish-sq.jpg',salmon:'img/salmon-sq.jpg'};
const WHOLE=/plateau verse vis|zeebaars à la|sardien|dorade|zeebaarsfilet|tonijn$|zwaardvis|blacktigers|venus|scampi|calamares|kreeft/i;
(function assignPhotos(){let n=0;MENU.forEach(sec=>{if(sec.where!=='toog')return;sec.items.forEach(it=>{if(it.group||it.img)return;
  const nm=it.name.nl; it.img=/zalm/i.test(nm)?'salmon':WHOLE.test(nm)?'fish':(n++%2?'fish':'salmon');});});})();
const tagsHTML=it=>it.tags?`<div class="tags">${it.tags.map(g=>`<span class="${g==='sig'?'s':''}">${tx(TAG[g])}</span>`).join('')}</div>`:'';
const varsHTML=it=>it.v.map(v=>`<div class="var">${v.label?`<span class="vl">${tx(v.label)}</span>`:''}<span class="price">${fmt(v.price)}${unitTxt(v.unit)}</span>${qtyHTML(v.id)}</div>`).join('');
function itemHTML(it){
  const head=`<h4>${tx(it.name)}</h4>${it.desc?`<p class="d">${tx(it.desc)}</p>`:''}${tagsHTML(it)}`;
  if(it.img) return `<div class="item ph"><div class="thumb"><img src="${PHOTO[it.img]}" alt="${tx(it.name)}" loading="lazy"></div><div>${head}<div class="bottom">${varsHTML(it)}</div></div></div>`;
  return `<div class="item"><div>${head}</div><div class="right">${varsHTML(it)}</div></div>`;
}

/* ---------- Render ---------- */
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.getElementById('langs').innerHTML=['nl','fr','en'].map(l=>`<button class="${l===lang?'on':''}" data-l="${l}">${l.toUpperCase()}</button>`).join('');
  document.getElementById('steps').innerHTML=t('steps').map((s,i)=>`<div class="step"><b>0${i+1}</b><p>${s}</p></div>`).join('');
  document.getElementById('rail').innerHTML=SIG.map(c=>`<a class="card${c.img?' photo':''}" href="#${c.to}"><div class="art">${c.img?`<img src="${c.img}" alt="">`:ART[c.art]}</div><div class="meta"><small>${tx(c.k)}</small><h3>${tx(c.name)}</h3><div class="p">${c.from?t('from')+' ':''}€ ${fmt(c.price)}${c.unit==='kg'?' / kg':''}</div></div></a>`).join('');
  document.getElementById('pills').innerHTML=MENU.map(s=>`<a href="#${s.id}" data-s="${s.id}">${tx(s.nav)}</a>`).join('');
  document.getElementById('menu').innerHTML=MENU.map(sec=>`
   <section class="cat" id="${sec.id}">
    <div class="cat-head"><div><h2>${tx(sec.title)}</h2><div class="where"><i></i>${sec.where==='toog'?t('wToog'):t('wTafel')}</div></div><div class="ic">${ART[sec.icon]}</div></div>
    ${sec.intro?`<p class="intro">${tx(sec.intro)}</p>`:''}
    ${sec.items.map(it=>it.group?`<div class="group">${tx(it.group)}</div>`:`
     ${itemHTML(it)}`).join('')}
    ${sec.note?`<div class="note">${tx(sec.note)}</div>`:''}
   </section>`).join('');
  observe(); renderBar(); if(sheetOpen)renderSheet();
}

function lineName(id){const {v,it}=V[id];return tx(it.name)+(v.label?` · ${tx(v.label)}`:'')}
function summary(){let n=0,sum=0,w=false;for(const id in sel){const q=sel[id],{v}=V[id];n+=q;if(v.unit==='kg')w=true;else sum+=q*v.price}return{n,sum,w}}
function renderBar(){
  const {n,sum,w}=summary();
  document.getElementById('bar').classList.toggle('show',n>0&&!sheetOpen);
  document.getElementById('barTxt').innerHTML=`<span class="count">${n}</span>€ ${fmt(sum)}${w?` <small style="display:inline;letter-spacing:0;text-transform:none;color:rgba(255,237,223,.6);font-size:12px">${t('weightNote')}</small>`:''}`;
}
function renderSheet(){
  const ids=Object.keys(sel);
  const body=document.getElementById('sheetBody');
  document.getElementById('tnum').value=table;
  if(!ids.length){body.innerHTML=`<p class="emptyMsg">${t('empty')}</p>`;return}
  const grp=w=>ids.filter(id=>V[id].sec.where===w);
  const rows=list=>list.map(id=>{const {v}=V[id];return `<div class="srow"><div class="nm">${lineName(id)}<small>${v.unit==='kg'?`€ ${fmt(v.price)} / kg · ${t('weight')}`:`€ ${fmt(v.price)}`}</small></div><div></div>${qtyHTML(id)}</div>`}).join('');
  const a=grp('toog'),b=grp('tafel'),{sum,w}=summary();
  body.innerHTML=(a.length?`<div class="sgroup"><h5>${t('atCounter')}</h5>${rows(a)}</div>`:'')+(b.length?`<div class="sgroup"><h5>${t('atTable')}</h5>${rows(b)}</div>`:'')+
   `<div class="tot"><span>${t('total')}</span><b>€ ${fmt(sum)}</b></div>${w?`<div class="wnote">${t('weightNote')}</div>`:''}`;
}
function renderCounter(){
  const ids=Object.keys(sel),a=ids.filter(id=>V[id].sec.where==='toog'),b=ids.filter(id=>V[id].sec.where==='tafel');
  const li=id=>{const {v}=V[id];return `<li><b>${sel[id]}×</b><div>${lineName(id)}${v.unit==='kg'?`<small>${t('weight')}</small>`:''}</div></li>`};
  document.getElementById('counterBody').innerHTML=`<div class="tnum">${t('tafel')}<b>${table||'—'}</b></div>
   ${a.length?`<ul>${a.map(li).join('')}</ul>`:''}
   ${b.length?`<div class="sub">${t('forWaiter')}</div><ul>${b.map(li).join('')}</ul>`:''}
   <p class="foot">${t('showHint')}</p>`;
}

/* ---------- Interactions ---------- */
function change(id,d){const n=Math.max(0,(sel[id]||0)+d);if(n)sel[id]=n;else delete sel[id];store.set('sel',sel);
  document.querySelectorAll(`.qty[data-id="${id}"]`).forEach(q=>{q.classList.toggle('has',n>0);q.querySelector('.n').textContent=n});
  renderBar(); if(sheetOpen)renderSheet();}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(b){const id=b.closest('.qty').dataset.id;change(id,b.dataset.act==='inc'?1:-1);return}
  const l=e.target.closest('[data-l]'); if(l){lang=l.dataset.l;store.set('lang',lang);render();}
});
let sheetOpen=false;
const sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim');
function openSheet(){sheetOpen=true;renderSheet();sheet.classList.add('show');scrim.classList.add('show');renderBar()}
function closeSheet(){sheetOpen=false;sheet.classList.remove('show');scrim.classList.remove('show');renderBar()}
document.getElementById('openSheet').onclick=openSheet; scrim.onclick=closeSheet;
document.getElementById('clear').onclick=()=>{sel={};store.set('sel',sel);render();renderSheet()};
const tn=document.getElementById('tnum');
const setT=v=>{table=v===''?'':String(Math.min(99,Math.max(1,parseInt(v)||1)));tn.value=table;store.set('table',table)};
tn.oninput=()=>{table=tn.value.slice(0,2);store.set('table',table)};
document.getElementById('tPlus').onclick=()=>setT((parseInt(table)||0)+1);
document.getElementById('tMinus').onclick=()=>setT(table?(parseInt(table)-1||1):'');
document.getElementById('showBtn').onclick=()=>{if(!Object.keys(sel).length)return; if(!table){tn.focus();tn.placeholder='?';document.querySelector('.tbl').animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:260});return}
  renderCounter();document.getElementById('counter').classList.add('on')};
document.getElementById('closeCounter').onclick=()=>document.getElementById('counter').classList.remove('on');

/* active pill */
let io;
function observe(){ if(io)io.disconnect();
  io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){document.querySelectorAll('.pills a').forEach(a=>{const on=a.dataset.s===en.target.id;a.classList.toggle('on',on);if(on){const p=a.parentElement;p.scrollTo({left:a.offsetLeft-p.clientWidth/2+a.clientWidth/2,behavior:'smooth'})}})}})},{rootMargin:'-30% 0px -65% 0px'});
  document.querySelectorAll('section.cat').forEach(s=>io.observe(s));
}
render();
</script>
</body>
</html>
